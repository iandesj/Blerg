name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build release archives
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          ldflags="-s -w -X github.com/iandesj/blerg/internal/cli.Version=${version}"
          build() {
            os="$1"
            arch="$2"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/blerg${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags "$ldflags" -o "$out" ./cmd/blerg
            archive="blerg_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd dist && zip "${archive}.zip" "blerg.exe")
              rm -f "$out"
            else
              tar -C dist -czf "dist/${archive}.tar.gz" "blerg${ext}"
              rm -f "$out"
            fi
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          (cd dist && sha256sum ./* > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
