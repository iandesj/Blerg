# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # allow custom tags if needed
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        # Remove this repo block if you do not use GitHub Actions

  - repo: local
    hooks:
      - id: lizard-complexity
        name: Lizard complexity
        entry: lizard
        language: python
        additional_dependencies:
          - lizard==1.26.0
        args:
          - --warnings_only
          - -C
          - "10"
          - --length
          - "80"
          - -a
          - "5"
        files: \.(c|cc|cpp|cxx|h|hpp|hxx|cs|go|java|js|jsx|kt|kts|php|py|rb|rs|scala|swift|ts|tsx|vue)$
        exclude: ^(vendor/|node_modules/|\.venv/)
